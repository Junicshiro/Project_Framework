        <div class="container">
          <h2 class="text-center text-danger fw-bold mb-5">Semua Produk</h2>

            <div class="col-md-4 ms-auto">
              <select id="filterHarga" class="form-select">
                <option value="default">Urutkan berdasarkan</option>
                <option value="asc">Harga Termurah</option>
                <option value="desc">Harga Termahal</option>

          <!-- Card Section -->

    <script src="assets\bootstrap\js\bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('produk').addEventListener('click', function(event) {
            // Jika klik dilakukan pada elemen dengan id 'produk', arahkan ke produk.html
            window.location.href = 'produk.html';
        });

        // Ambil semua tombol favorite
        // const favoriteButtons = document.querySelectorAll('.btn[title="Tambah ke Favorit"]');

        // favoriteButtons.forEach(button => {
        //   button.addEventListener('click', () => {
        //     const icon = button.querySelector('i');

        //     // Toggle class ikon dari bi-heart ke bi-heart-fill dan sebaliknya
        //     if (icon.classList.contains('bi-heart')) {
        //       icon.classList.remove('bi-heart');
        //       icon.classList.add('bi-heart-fill');
        //       icon.classList.add('text-danger'); // warna merah
        //     } else {
        //       icon.classList.remove('bi-heart-fill');
        //       icon.classList.remove('text-danger');
        //       icon.classList.add('bi-heart');
        //     }
        //   });
        // });

        const elamoreUser = JSON.parse(localStorage.getItem("elamoreUser"));
        const userId = elamoreUser?.id || null;

        let semuaProduk = [];

        function tampilkanProduk(produkArray) {
          const row = document.getElementById("produk-container");
          row.innerHTML = "";

          if (produkArray.length === 0) {
            row.innerHTML = `<div class="col text-center text-muted">Produk tidak ditemukan.</div>`;
            return;
          }

          produkArray.forEach(product => {
            row.innerHTML += `
              <div class="col-md-4">
                <div class="card shadow-sm border-0 h-100 hover-shadow transition" data-id="${product.id}">
                  <button type="button" class="btn btn-light btn-sm rounded-circle position-absolute top-0 end-0 m-2 shadow-sm" title="Tambah ke Favorit">
                    <i class="bi bi-heart"></i>
                  </button>
                  <img src="${product.gambar}" class="card-img-top" alt="${product.nama_produk}">
                  <div class="card-body text-center">
                    <h5 class="card-title text-danger fw-semibold">${product.nama_produk}</h5>
                    <p class="card-text text-muted fs-5 mb-3">Rp ${product.harga.toLocaleString('id-ID')}</p>
                    <button type="button" class="btn btn-outline-danger rounded-pill px-4">Tambah ke Keranjang</button>
                  </div>
                </div>
              </div>`;
          });

          setTimeout(() => {
            // Tombol Favorit
            document.querySelectorAll('[title="Tambah ke Favorit"]').forEach((btn, index) => {
              btn.addEventListener("click", () => {
                if (!userId) return alert("Silakan login terlebih dahulu.");
                const productId = document.querySelectorAll(".card")[index].getAttribute("data-id");

                fetch("http://localhost:8000/api/favorites", {
                  method: "POST",
                  headers: { "Content-Type": "application/json", "Accept": "application/json" },
                  body: JSON.stringify({ user_id: userId, product_id: productId }),
                }).then(res => res.json())
                  .then(() => {
                    const icon = btn.querySelector("i");
                    icon.classList.remove("bi-heart");
                    icon.classList.add("bi-heart-fill", "text-danger");
                  });
              });
            });

            // Tombol Keranjang
            document.querySelectorAll(".btn-outline-danger").forEach((btn, index) => {
              btn.addEventListener("click", () => {
                if (!userId) return alert("Silakan login terlebih dahulu.");
                const productId = document.querySelectorAll(".card")[index].getAttribute("data-id");

                fetch("http://localhost:8000/api/cart", {
                  method: "POST",
                  headers: { "Content-Type": "application/json", "Accept": "application/json" },
                  body: JSON.stringify({ user_id: userId, product_id: productId, quantity: 1 }),
                }).then(res => res.json())
                  .then(() => alert("Produk berhasil ditambahkan ke keranjang."));
              });
            });
          }, 300);
        }

        document.addEventListener("DOMContentLoaded", function () {
        const ikonUser = document.querySelector(".bi-person-circle");

        if (ikonUser) {
          ikonUser.addEventListener("click", function (e) {
            e.preventDefault();

            const user = localStorage.getItem("elamoreUser");

            if (user) {
              window.location.href = "akun_user.html"; // Sudah login
            } else {
              window.location.href = "login.html"; // Belum login
            }
          });
        }

        fetch("http://localhost:8000/api/products")
          .then(response => response.json())
          .then(products => {
            semuaProduk = products;

            // Ambil parameter q dari URL jika ada
            const params = new URLSearchParams(window.location.search);
            const keyword = params.get("q")?.toLowerCase();

            let hasil = semuaProduk;

            if (keyword) {
              hasil = semuaProduk.filter(p =>
                p.nama_produk.toLowerCase().includes(keyword) ||
                p.kategori.toLowerCase().includes(keyword)
              );

              // Ganti judul menjadi hasil pencarian
              const h2 = document.querySelector("h2.text-danger");
              if (h2) h2.innerText = `Hasil pencarian untuk: "${keyword}"`;
            }

            tampilkanProduk(hasil);
          });

        document.getElementById("filterHarga").addEventListener("change", function () {
          const selected = this.value;
          let hasil = [...semuaProduk];

          if (selected === "asc") {
            hasil.sort((a, b) => a.harga - b.harga);
          } else if (selected === "desc") {
            hasil.sort((a, b) => b.harga - a.harga);
          }

          tampilkanProduk(hasil);
        });
      });

      // Pencarian produk dari dalam halaman produk.html
      document.getElementById("btnSearch").addEventListener("click", function () {
        const keyword = document.getElementById("searchBar").value.trim();
        if (keyword) {
          window.location.href = `produk.html?q=${encodeURIComponent(keyword)}`;
        }
      });

      document.getElementById("searchBar").addEventListener("keypress", function (e) {
        if (e.key === "Enter") {
          e.preventDefault();
          document.getElementById("btnSearch").click();
        }
      });
    </script>
