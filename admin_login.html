<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login Admin - Elamore</title>
  <link rel="stylesheet" href="assets/bootstrap/css/bootstrap.min.css" />
</head>
<body style="background-color: #feedf3;" class="d-flex align-items-center justify-content-center min-vh-100">

  <div class="card shadow-sm p-4" style="max-width: 420px; width: 100%;">
    <div class="text-center mb-3">
      <h2 class="text-danger fw-bold">Elamore Admin</h2>
      <p class="text-muted small">Masuk untuk mengelola data</p>
    </div>

    <div class="mb-3">
      <label for="email" class="form-label">Email Admin</label>
      <input type="email" class="form-control" id="email" placeholder="admin@elamore.com" required />
    </div>

    <div class="mb-3">
      <label for="password" class="form-label">Password</label>
      <input type="password" class="form-control" id="password" placeholder="******" required />
    </div>

    <div id="errorMsg" class="text-danger small mb-2 d-none"></div>

    <div class="d-grid mb-3">
      <button class="btn btn-danger" onclick="loginAdmin()">Login</button>
    </div>

    <div class="text-center">
      <a href="index.html" class="text-decoration-none text-muted small">← Kembali ke Beranda</a>
    </div>
  </div>

  <script>
    function loginAdmin() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      fetch("https://elamore-backend-production.up.railway.app/api/admin/login", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Accept: "application/json",
        },
        body: JSON.stringify({ email, password }),
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          localStorage.setItem("elamoreAdmin", JSON.stringify(data.admin));
          window.location.href = "admin_dashboard.html";
        } else {
          const errBox = document.getElementById("errorMsg");
          errBox.innerText = data.message;
          errBox.classList.remove("d-none");
        }
      });
    }
  </script>
</body>
</html>
