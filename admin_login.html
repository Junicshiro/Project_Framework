<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">
  <div class="container d-flex align-items-center justify-content-center min-vh-100">
    <div class="card shadow-sm p-4" style="max-width: 400px; width: 100%;">
      <h4 class="text-center mb-3 text-danger">Login Admin</h4>
      <div class="mb-3">
        <label class="form-label">Email Admin</label>
        <input type="email" class="form-control" id="email" required />
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" class="form-control" id="password" required />
      </div>
      <div class="d-grid">
        <button class="btn btn-danger" onclick="loginAdmin()">Login</button>
      </div>
      <div id="errorMsg" class="text-danger mt-2 small d-none"></div>
    </div>
  </div>

  <script>
    function loginAdmin() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      fetch("https://elamore-backend-production.up.railway.app/api/admin/login", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Accept: "application/json",
        },
        body: JSON.stringify({ email, password }),
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          localStorage.setItem("elamoreAdmin", JSON.stringify(data.admin));
          window.location.href = "admin_dashboard.html";
        } else {
          document.getElementById("errorMsg").innerText = data.message;
          document.getElementById("errorMsg").classList.remove("d-none");
        }
      });
    }
  </script>
</body>
</html>
