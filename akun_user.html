<script>
  // document.getElementById('produk').addEventListener('click', function(event) {

  // window.location.href = 'produk.html';

  function logout() {
    localStorage.removeItem("elamoreUser");
    window.location.href = "login.html";
  }

    document.addEventListener("DOMContentLoaded", function () {
    document.querySelectorAll(".bi-person-circle").forEach(icon => {
      icon.addEventListener("click", function (e) {
        e.preventDefault();
        const userRaw = localStorage.getItem("elamoreUser");
        let userId = null;

        try {
          const elamoreUser = userRaw ? JSON.parse(userRaw) : null;
          userId = elamoreUser?.id || null;
        } catch (err) {
          console.warn("Gagal membaca localStorage:", err);
        }

        if (userId) {
          window.location.href = "akun_user.html";
        } else {
          window.location.href = "login.html";
        }
      });
    });
  });

document.addEventListener("DOMContentLoaded", function () {
  const user = JSON.parse(localStorage.getItem("elamoreUser"));

  if (!user) {
    alert("Silakan login terlebih dahulu.");
    window.location.href = "login.html";
    return;
  }

  // Ganti bagian profil utama
  document.querySelector("h5.mb-0").textContent = user.name;
  document.querySelector(".text-muted").textContent = user.email;

  // Ganti alamat samping foto
  const alamatElemen = document.querySelector(".card-body small.text-muted i.bi-geo-alt-fill").parentElement;
  alamatElemen.innerHTML = `<i class="bi bi-geo-alt-fill me-1"></i>${user.alamat}`;

  // Ganti bagian info akun di tab "Akun"
  const infoRows = document.querySelectorAll("#account .row");
  infoRows[0].querySelector(".col-sm-8").textContent = user.name;
  infoRows[1].querySelector(".col-sm-8").textContent = user.email;
  infoRows[2].querySelector(".col-sm-8").textContent = user.nomor;
  infoRows[3].querySelector(".col-sm-8").textContent = user.alamat;

  const userId = user.id;

  function getBadgeClass(status) {
    switch (status) {
      case "pending":
        return "bg-secondary text-white";
      case "confirmed":
        return "bg-warning text-dark";
      case "shipped":
        return "bg-primary text-white";
      case "delivered":
        return "bg-success text-white";
      case "canceled":
        return "bg-danger text-white";
      default:
        return "bg-light text-dark";
    }
  }

  // AMBIL PESANAN
  fetch(`https://elamore-backend-production.up.railway.app/api/orders/${userId}`)
    .then(res => res.json())
    .then(data => {
      const ordersContainer = document.getElementById("orders");
      ordersContainer.innerHTML = ""; // Bersihkan dummy

      if (data.length === 0) {
        ordersContainer.innerHTML = "<p class='text-center text-muted'>Belum ada pesanan.</p>";
      } else {
        data.forEach(order => {
          order.items.forEach(item => {
            const card = document.createElement("div");
            card.className = "card mb-3";
            card.innerHTML = `
              <div class="card-body d-flex align-items-center">
                <img src="${item.product.gambar}" class="me-3" alt="${item.product.nama_produk}" style="width: 80px; height: 80px;">
                <div class="flex-grow-1">
                  <h6 class="mb-1">${item.product.nama_produk}</h6>
                  <small class="text-muted">Rp ${item.product.harga.toLocaleString("id-ID")}</small>
                </div>
                <div>
                  <span class="badge ${getBadgeClass(order.status)} text-capitalize">${order.status}</span>
                </div>
              </div>
            `;
            ordersContainer.appendChild(card);
          });
        });
      }
    });

  // AMBIL FAVORIT
  fetch(`https://elamore-backend-production.up.railway.app/api/favorites/${userId}`)
    .then(res => res.json())
    .then(data => {
      const favContainer = document.getElementById("wishlist");
      favContainer.innerHTML = ""; // Bersihkan dummy

      if (data.length === 0) {
        favContainer.innerHTML = "<p class='text-center text-muted'>Belum ada produk favorit.</p>";
      } else {
        data.forEach(item => {
          const card = document.createElement("div");
          card.className = "card mb-3";
          card.innerHTML = `
            <div class="card-body d-flex align-items-center">
              <img src="${item.product.gambar}" class="me-3" style="width: 80px; height: 80px;">
              <div class="flex-grow-1">
                <h6 class="mb-1">${item.product.nama_produk}</h6>
                <small class="text-muted">Rp ${item.product.harga.toLocaleString("id-ID")}</small>
              </div>
              <div>
                <button class="btn btn-sm btn-outline-danger" onclick="hapusFavorit(${item.id})">Hapus</button>
              </div>
            </div>
          `;
          favContainer.appendChild(card);
        });
      }
    });

  function hapusFavorit(favId) {
    fetch(`https://elamore-backend-production.up.railway.app/api/favorites/${favId}`, {
      method: "DELETE"
    })
      .then(res => res.json())
      .then(result => {
        alert("Produk dihapus dari favorit");
        location.reload();
      });
  }

});

// Tombol ubah info
document.getElementById("btnUbahInfo").addEventListener("click", function (e) {
  e.preventDefault();

  const user = JSON.parse(localStorage.getItem("elamoreUser"));

  document.getElementById("editUserId").value = user.id;
  document.getElementById("editNama").value = user.name;
  document.getElementById("editEmail").value = user.email;
  document.getElementById("editNomor").value = user.nomor;
  document.getElementById("editAlamat").value = user.alamat;

  const modal = new bootstrap.Modal(document.getElementById("modalEditUser"));
  modal.show();
});



document.getElementById("formEditUser").addEventListener("submit", async function (e) {
  e.preventDefault();

  const id = document.getElementById("editUserId").value;
  const data = {
    name: document.getElementById("editNama").value,
    email: document.getElementById("editEmail").value,
    nomor: document.getElementById("editNomor").value,
    alamat: document.getElementById("editAlamat").value,
  };

  try {
    const response = await fetch(`https://elamore-backend-production.up.railway.app/api/user/${id}`, {
      method: "PUT",
      headers: {
        "Content-Type": "application/json",
        "Accept": "application/json"
      },
      body: JSON.stringify(data)
    });

    const result = await response.json();

    if (response.ok) {
      alert("Informasi berhasil diperbarui!");

      // Simpan user terbaru ke localStorage
      localStorage.setItem("elamoreUser", JSON.stringify(result.user));

      // Tutup modal dan refresh
      bootstrap.Modal.getInstance(document.getElementById("modalEditUser")).hide();
      location.reload();
    } else {
      alert("Gagal memperbarui: " + JSON.stringify(result));
    }
  } catch (error) {
    alert("Terjadi kesalahan: " + error.message);
  }
});

// Desktop
  document.getElementById("btnSearchDesktop").addEventListener("click", function () {
    const keyword = document.getElementById("searchDesktop").value.trim();
    if (keyword) {
      window.location.href = `produk.html?q=${encodeURIComponent(keyword)}`;
    }
  });

  document.getElementById("searchDesktop").addEventListener("keypress", function (e) {
    if (e.key === "Enter") {
      e.preventDefault();
      document.getElementById("btnSearchDesktop").click();
    }
  });

  // Mobile
  document.getElementById("btnSearchMobile").addEventListener("click", function () {
    const keyword = document.getElementById("searchMobile").value.trim();
    if (keyword) {
      // Tutup modal dulu
      const modal = bootstrap.Modal.getInstance(document.getElementById('searchModal'));
      modal.hide();
      setTimeout(() => {
        window.location.href = `produk.html?q=${encodeURIComponent(keyword)}`;
      }, 300);
    }
  });

  document.getElementById("searchMobile").addEventListener("keypress", function (e) {
    if (e.key === "Enter") {
      e.preventDefault();
      document.getElementById("btnSearchMobile").click();
    }
  });

  const TIMEOUT = 30 * 1000; // 30 menit dalam milidetik

  function perbaruiAktivitas() {
    localStorage.setItem("elamoreLastActive", Date.now());
  }

  function cekAutoLogout() {
    const user = localStorage.getItem("elamoreUser");
    const last = localStorage.getItem("elamoreLastActive");

    if (user && last && Date.now() - last > TIMEOUT) {
      localStorage.removeItem("elamoreUser");
      localStorage.removeItem("elamoreLastActive");
      window.location.href = "login.html";
    }
  }

  // Simpan waktu aktif saat halaman dimuat pertama kali
  perbaruiAktivitas();

  // Setiap aktivitas akan memperbarui waktu
  ["click", "mousemove", "keypress", "scroll", "touchstart"].forEach(event =>
    window.addEventListener(event, perbaruiAktivitas)
  );

  // Cek apakah waktunya logout setiap menit
  setInterval(cekAutoLogout, 60000);
</script>
