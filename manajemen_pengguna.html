<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manajemen Pengguna - Elamore</title>
  <link rel="stylesheet" href="assets/bootstrap/css/bootstrap.min.css" />
  <link rel="stylesheet" href="assets/bootstrap/bootstrap-icons-1.11.3/font/bootstrap-icons.min.css" />
</head>

<body style="background-color: #feedf3;">

  <!-- Navbar -->
  <nav class="navbar navbar-dark" style="background-color: #E91E63;">
    <div class="container-fluid">
      <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <span class="navbar-brand ms-2">Admin Elamore</span>
    </div>
  </nav>

  <!-- Sidebar Offcanvas (untuk semua ukuran layar) -->
  <div class="offcanvas offcanvas-start text-white" tabindex="-1" id="sidebarMenu" style="background-color: #ff71a3;">
    <div class="offcanvas-header" style="background-color: #E91E63;">
      <h5 class="offcanvas-title">Menu</h5>
      <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body">
      <ul class="nav flex-column">
        <li class="nav-item">
          <a href="admin_dashboard.html" class="nav-link text-white active link-danger opacity-75">
            <i class="bi bi-house-door me-2"></i> Dashboard
          </a>
        </li>
        <li class="nav-item">
          <a href="manajemen_produk.html" class="nav-link text-white active link-danger opacity-75">
            <i class="bi bi-box me-2"></i> Produk
          </a>
        </li>
        <li class="nav-item">
          <a href="manajemen_pesanan.html" class="nav-link text-white link-danger opacity-75">
            <i class="bi bi-bag me-2"></i> Pesanan
          </a>
        </li>
        <li class="nav-item">
          <a href="manajemen_pengguna.html" class="nav-link text-white fw-bold">
            <i class="bi bi-people me-2"></i> Pengguna
          </a>
        </li>
        <li class="nav-item">
          <button id="btnLogoutAdmin" class="nav-link text-white link-danger opacity-75 border-0 bg-transparent">
            <i class="bi bi-box-arrow-right me-2"></i> Logout
          </button>
        </li>
      </ul>
    </div>
  </div>

  <!-- Konten Utama -->
  <div class="min-vh-100">
    <div class="container-fluid px-4 py-4">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-box"></i> Manajemen Pengguna</h2>
      </div>

      <div class="input-group mb-3">
        <input type="text" class="form-control" id="searchUser" placeholder="Cari nama atau email pengguna...">
        <button class="btn btn-outline-secondary" type="button" onclick="loadUsers()">Cari</button>
      </div>


      <div class="table-responsive d-none d-sm-block">
        <table class="table table-hover table-bordered text-center align-middle">
          <thead class="table-danger">
            <tr>
              <th>ID</th>
              <th>Nama</th>
              <th>Email</th>
              <th>Nomor</th>

              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="user-list">

          </tbody>
        </table>
      </div>
    </div>

    <!-- Tampilkan hanya di perangkat mobile -->
    <div class="d-block d-sm-none px-3" id="user-cards">


    </div>
  </div>

  <!-- Modal Edit Pengguna -->
  <div class="modal fade" id="modalEditUser" tabindex="-1" aria-labelledby="modalEditUserLabel" aria-hidden="true">
    <div class="modal-dialog">
      <form id="formEditUser" class="modal-content">
        <div class="modal-header bg-warning text-dark">
          <h5 class="modal-title" id="modalEditUserLabel">Edit Pengguna</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="editUserId">
          <div class="mb-3">
            <label for="editUserName" class="form-label">Nama</label>
            <input type="text" id="editUserName" class="form-control" required>
          </div>
          <div class="mb-3">
            <label for="editUserEmail" class="form-label">Email</label>
            <input type="email" id="editUserEmail" class="form-control" required>
          </div>
          <div class="mb-3">
            <label for="editUserNomor" class="form-label">Nomor HP</label>
            <input type="text" id="editUserNomor" class="form-control">
          </div>
          <div class="mb-3">
            <label for="editUserAlamat" class="form-label">Alamat</label>
            <textarea id="editUserAlamat" class="form-control" rows="2"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-warning">Simpan</button>
        </div>
      </form>
    </div>
  </div>

  <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 9999">
    <div id="toastNotifikasi" class="toast align-items-center text-bg-success border-0" role="alert"
      aria-live="assertive" aria-atomic="true">
      <div class="d-flex">
        <div class="toast-body" id="toastMessage">
          Berhasil!
        </div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"
          aria-label="Close"></button>
      </div>
    </div>
  </div>

  <!-- Modal Konfirmasi Hapus Pengguna -->
  <div class="modal fade" id="modalKonfirmasiHapusUser" tabindex="-1" aria-labelledby="modalHapusUserLabel"
    aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow">
        <div class="modal-header bg-danger text-white">
          <h5 class="modal-title" id="modalHapusUserLabel">Konfirmasi Hapus</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Tutup"></button>
        </div>
        <div class="modal-body">
          Apakah Anda yakin ingin menghapus pengguna ini?
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
          <button type="button" class="btn btn-danger" id="btnKonfirmasiHapusUser">Hapus</button>
        </div>
      </div>
    </div>
  </div>

  <script src="assets/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", loadUsers);
    function loadUsers() {
      const query = document.getElementById("searchUser").value.toLowerCase();

      fetch("https://elamore-backend-production.up.railway.app/api/users")
        .then(res => res.json())
        .then(users => {
          const tbody = document.getElementById("user-list");
          const cards = document.getElementById("user-cards");
          tbody.innerHTML = "";
          cards.innerHTML = "";

          const filtered = users.filter(user =>
            user.name.toLowerCase().includes(query) ||
            user.email.toLowerCase().includes(query)
          );

          if (filtered.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6">Tidak ada pengguna ditemukan.</td></tr>';
            return;
          }

          filtered.forEach(user => {
            // Tampilkan ke tabel desktop
            tbody.innerHTML += `
        <tr>
          <td>USR-${String(user.id).padStart(3, "0")}</td>
          <td>${user.name}</td>
          <td>${user.email}</td>
          <td>${user.nomor || "-"}</td>
          
          <td>
            <button class="btn btn-warning btn-sm me-2" onclick="editUser(${user.id})"><i class="bi bi-pencil"></i></button>
            <button class="btn btn-danger btn-sm" onclick="hapusUser(${user.id})"><i class="bi bi-trash"></i></button>
          </td>
        </tr>
      `;

            // Tampilkan ke kartu mobile
            cards.innerHTML += `
        <div class="card mb-3 shadow-sm border-0" style="border-radius: 12px;">
          <div class="card-body">
            <h6 class="card-title fw-bold mb-2 text-truncate">Pengguna #USR-${String(user.id).padStart(3, "0")}</h6>
            <div class="small text-muted mb-1">Nama: <span class="text-dark">${user.name}</span></div>
            <div class="small text-muted mb-1">Email: <span class="text-dark">${user.email}</span></div>
            <div class="small text-muted mb-1">Nomor: <span class="text-dark">${user.nomor || "-"}</span></div>
            
            <div class="d-flex gap-2">
              <button class="btn btn-sm btn-outline-warning flex-fill" onclick="editUser(${user.id})"><i class="bi bi-pencil"></i> Edit</button>
              <button class="btn btn-sm btn-outline-danger flex-fill" onclick="hapusUser(${user.id})"><i class="bi bi-trash"></i> Hapus</button>
            </div>
          </div>
        </div>
      `;
          });

        });

    }

    // Tampilkan modal edit
    function editUser(id) {
      fetch(`https://elamore-backend-production.up.railway.app/api/users`)
        .then(res => res.json())
        .then(users => {
          const user = users.find(u => u.id === id);
          if (!user) return;

          document.getElementById("editUserId").value = user.id;
          document.getElementById("editUserName").value = user.name;
          document.getElementById("editUserEmail").value = user.email;
          document.getElementById("editUserNomor").value = user.nomor || "";
          document.getElementById("editUserAlamat").value = user.alamat || "";

          new bootstrap.Modal(document.getElementById("modalEditUser")).show();
        });
    }

    // Submit edit
    document.getElementById("formEditUser").addEventListener("submit", async function (e) {
      e.preventDefault();
      const id = document.getElementById("editUserId").value;
      const data = {
        name: document.getElementById("editUserName").value,
        email: document.getElementById("editUserEmail").value,
        nomor: document.getElementById("editUserNomor").value,
        alamat: document.getElementById("editUserAlamat").value
      };

      const res = await fetch(`https://elamore-backend-production.up.railway.app/api/users/${id}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json", "Accept": "application/json" },
        body: JSON.stringify(data)
      });
      const result = await res.json();

      if (res.ok) {
        showToast("Berhasil diubah!", "success");
        bootstrap.Modal.getInstance(document.getElementById("modalEditUser")).hide();
        loadUsers();
      } else {
        showToast("Gagal: " + (result?.message || "Terjadi kesalahan"), "danger");
      }
    });

    // Hapus user
    let userUntukDihapus = null;

    function hapusUser(id) {
      userUntukDihapus = id;
      const modal = new bootstrap.Modal(document.getElementById("modalKonfirmasiHapusUser"));
      modal.show();
    }

    document.getElementById("btnKonfirmasiHapusUser").addEventListener("click", function () {
      if (!userUntukDihapus) return;

      showToast("Menghapus pengguna...", "warning");

      fetch(`https://elamore-backend-production.up.railway.app/api/users/${userUntukDihapus}`, {
        method: "DELETE"
      })
        .then(res => {
          if (!res.ok) throw new Error("Gagal menghapus pengguna.");
          return res.json();
        })
        .then(() => {
          showToast("Pengguna berhasil dihapus!", "success");
          loadUsers();
        })
        .catch(() => {
          showToast("Terjadi kesalahan saat menghapus pengguna.", "danger");
        })
        .finally(() => {
          const modal = bootstrap.Modal.getInstance(document.getElementById("modalKonfirmasiHapusUser"));
          modal.hide();
          userUntukDihapus = null;
        });
    });


    // Panggil saat halaman dimuat
    document.addEventListener("DOMContentLoaded", loadUsers);

    document.getElementById("btnLogoutAdmin").addEventListener("click", function (e) {
      e.preventDefault();
      // Hapus data admin dari localStorage
      localStorage.removeItem("elamoreAdmin");
      // Redirect ke halaman login admin
      window.location.href = "admin_login.html";
    });

    const admin = localStorage.getItem("elamoreAdmin");
    if (!admin) {
      window.location.href = "admin_login.html"; // Redirect jika belum login
    }

    function showToast(pesan, warna = "success") {
      const toastElement = document.getElementById("toastNotifikasi");
      const toastBody = document.getElementById("toastMessage");

      toastBody.textContent = pesan;
      toastElement.className = `toast align-items-center text-bg-${warna} border-0`;

      const toast = new bootstrap.Toast(toastElement);
      toast.show();
    }

  </script>

</body>

</html>
