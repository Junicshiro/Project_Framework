<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manajemen Pesanan - Elamore</title>
  <link rel="stylesheet" href="assets/bootstrap/css/bootstrap.min.css" />
  <link rel="stylesheet" href="assets/bootstrap/bootstrap-icons-1.11.3/font/bootstrap-icons.min.css" />
</head>

<body style="background-color: #feedf3;">

  <!-- Navbar -->
  <nav class="navbar navbar-dark" style="background-color: #E91E63;">
    <div class="container-fluid">
      <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <span class="navbar-brand ms-2">Admin Elamore</span>
    </div>
  </nav>

  <!-- Sidebar Offcanvas (untuk semua ukuran layar) -->
  <div class="offcanvas offcanvas-start text-white" tabindex="-1" id="sidebarMenu" style="background-color: #ff71a3;">
    <div class="offcanvas-header" style="background-color: #E91E63;">
      <h5 class="offcanvas-title">Menu</h5>
      <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body">
      <ul class="nav flex-column">
        <li class="nav-item">
          <a href="admin_dashboard.html" class="nav-link text-white active link-danger opacity-75">
            <i class="bi bi-house-door me-2"></i> Dashboard
          </a>
        </li>
        <li class="nav-item">
          <a href="manajemen_produk.html" class="nav-link text-white active link-danger opacity-75">
            <i class="bi bi-box me-2"></i> Produk
          </a>
        </li>
        <li class="nav-item">
          <a href="manajemen_pesanan.html" class="nav-link text-white fw-bold">
            <i class="bi bi-bag me-2"></i> Pesanan
          </a>
        </li>
        <li class="nav-item">
          <a href="manajemen_pengguna.html" class="nav-link text-white link-danger opacity-75">
            <i class="bi bi-people me-2"></i> Pengguna
          </a>
        </li>
        <li class="nav-item">
          <button id="btnLogoutAdmin" class="nav-link text-white link-danger opacity-75 border-0 bg-transparent">
            <i class="bi bi-box-arrow-right me-2"></i> Logout
          </button>
        </li>
      </ul>
    </div>
  </div>

  <!-- Konten Utama -->
  <div class="min-vh-100">
    <div class="container-fluid px-4 py-4">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-bag"></i> Manajemen Pesanan</h2>
      </div>

      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <input type="text" class="form-control" id="searchPesanan" placeholder="Cari nama atau ID pesanan...">
        </div>
        <div class="col-md-6">
          <select class="form-select" id="filterStatus">
            <option selected>Filter Status</option>
            <option value="pending">Pending</option>
            <option value="confirmed">Confirmed</option>
            <option value="shipped">Shipped</option>
            <option value="delivered">Delivered</option>
            <option value="canceled">Canceled</option>
          </select>
        </div>
      </div>

      <div class="table-responsive d-none d-sm-block">
        <table class="table table-hover table-bordered text-center align-middle">
          <thead class="table-danger">
            <tr>
              <th>ID Pesanan</th>
              <th>Gambar</th>
              <th>Nama Pelanggan</th>
              <th>Tanggal</th>
              <th>Total</th>
              <th>Status</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="pesananBody">

          </tbody>
        </table>
      </div>
    </div>

    <!-- Tampilkan hanya di perangkat mobile -->
    <div class="d-block d-sm-none px-3" id="pesananMobile">

    </div>
  </div>

  <footer class="bg-dark text-white text-center py-3">
    <p>&copy; 2025 Elamore. All rights reserved.</p>
  </footer>

  <script src="assets/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script>
    const API = "https://elamore-backend-production.up.railway.app/api/orders";
    let semuaPesanan = [];

    document.addEventListener("DOMContentLoaded", () => {
      fetch(API)
        .then(res => res.json())
        .then(orders => {
          semuaPesanan = orders;
          renderPesanan(); // render pertama kali
        });

      // Tambahkan listener untuk pencarian & filter
      document.getElementById("searchPesanan").addEventListener("input", renderPesanan);
      document.getElementById("filterStatus").addEventListener("change", renderPesanan);
    });

    // Fungsi untuk merender pesanan berdasarkan pencarian & filter
    function renderPesanan() {
      const tbody = document.getElementById("pesananBody");
      const mobile = document.getElementById("pesananMobile");
      const keyword = document.getElementById("searchPesanan").value.toLowerCase();
      const filter = document.getElementById("filterStatus").value.toLowerCase();

      tbody.innerHTML = "";
      mobile.innerHTML = "";

      semuaPesanan
        .filter(order => {
          const cocokKeyword =
            order.nama.toLowerCase().includes(keyword) ||
            `ord-${order.id}`.includes(keyword);
          const cocokFilter = filter === "filter status" || order.status.toLowerCase() === filter;
          return cocokKeyword && cocokFilter;
        })
        .forEach(order => {
          const item = order.items[0];
          const total = order.total_harga.toLocaleString("id-ID");

          // Desktop row
          const tr = document.createElement("tr");
          tr.innerHTML = `
          <td>ORD-${order.id}</td>
          <td><img src="${item.product.gambar}" style="width: 60px; border-radius: 8px;"></td>
          <td>${order.nama}</td>
          <td>${new Date(order.created_at).toLocaleDateString()}</td>
          <td>Rp ${total}</td>
          <td><span class="badge ${getBadgeClass(order.status)} text-capitalize">${order.status}</span></td>
          <td id="aksi-${order.id}">
            ${renderActionButtons(order.id, order.status)}
          </td>
        `;
          tbody.appendChild(tr);

          // Mobile card
          const card = document.createElement("div");
          card.className = "card mb-3 shadow-sm border-0";
          card.innerHTML = `
          <div class="row g-0 align-items-center">
            <div class="col-4 ps-2">
              <img src="${item.product.gambar}" class="img-fluid rounded" style="border-radius: 10px;">
            </div>
            <div class="col-8">
              <div class="card-body p-2">
                <h6 class="card-title fw-bold mb-1">#ORD-${order.id}</h6>
                <div class="small text-muted mb-1">Pelanggan: <span class="text-dark">${order.nama}</span></div>
                <div class="small text-muted mb-1">Tanggal: <span class="text-dark">${new Date(order.created_at).toLocaleDateString()}</span></div>
                <div class="small text-muted mb-1">Total: <span class="text-success fw-semibold">Rp ${total}</span></div>
                <div class="small text-muted mb-1">Status: <span class="badge ${getBadgeClass(order.status)} text-capitalize">${order.status}</span></div>
                <div id="aksi-mob-${order.id}" class="d-flex gap-2 mt-2">
                  ${renderActionButtons(order.id, order.status, true)}
                </div>
              </div>
            </div>
          </div>
        `;
          mobile.appendChild(card);
        });
    }

    // Badge status warna
    function getBadgeClass(status) {
      switch (status) {
        case "pending": return "bg-secondary text-white";
        case "confirmed": return "bg-warning text-dark";
        case "shipped": return "bg-primary text-white";
        case "delivered": return "bg-success text-white";
        case "canceled": return "bg-danger text-white";
        default: return "bg-light text-dark";
      }
    }

    // Tombol aksi
    function renderActionButtons(orderId, status, isMobile = false) {
      if (status === "pending") {
        return `
        <button class="btn btn-sm btn-success me-2" onclick="ubahStatus(${orderId}, 'confirmed')">
          <i class="bi bi-check-circle"></i> ${isMobile ? 'Konfirmasi' : ''}
        </button>
        <button class="btn btn-sm btn-danger" onclick="ubahStatus(${orderId}, 'canceled')">
          <i class="bi bi-x-circle"></i> ${isMobile ? 'Tolak' : ''}
        </button>
      `;
      }
      if (status === "confirmed") {
        return `
        <button class="btn btn-sm btn-primary me-2" onclick="ubahStatus(${orderId}, 'shipped')">
          <i class="bi bi-truck"></i> ${isMobile ? 'Kirim' : ''}
        </button>
        <button class="btn btn-sm btn-danger" onclick="ubahStatus(${orderId}, 'canceled')">
          <i class="bi bi-x-circle"></i> ${isMobile ? 'Batal' : ''}
        </button>
      `;
      }
      if (status === "shipped") {
        return `
        <button class="btn btn-sm btn-success me-2" onclick="ubahStatus(${orderId}, 'delivered')">
          <i class="bi bi-check-circle"></i> ${isMobile ? 'Selesai' : 'Selesai'}
        </button>
      `;
      }
      if (status === "delivered") {
        return `<span class="badge bg-success">Selesai</span>`;
      }
      if (status === "canceled") {
        return `<span class="badge bg-secondary">Dibatalkan</span>`;
      }
      return `<span class="badge bg-light text-dark">${status}</span>`;
    }

    // Update status ke Laravel
    function ubahStatus(orderId, statusBaru) {
      fetch(`https://elamore-backend-production.up.railway.app/api/orders/${orderId}/status`, {
        method: "PUT",
        headers: {
          "Content-Type": "application/json",
          Accept: "application/json"
        },
        body: JSON.stringify({ status: statusBaru })
      })
        .then(res => res.json())
        .then(() => {
          // Update tanpa reload penuh
          const index = semuaPesanan.findIndex(o => o.id === orderId);
          if (index !== -1) semuaPesanan[index].status = statusBaru;
          renderPesanan();
        });
    }

    document.getElementById("btnLogoutAdmin").addEventListener("click", function (e) {
      e.preventDefault();
      // Hapus data admin dari localStorage
      localStorage.removeItem("elamoreAdmin");
      // Redirect ke halaman login admin
      window.location.href = "admin_login.html";
    });

    const admin = localStorage.getItem("elamoreAdmin");
    if (!admin) {
      window.location.href = "admin_login.html"; // Redirect jika belum login
    }
  </script>


</body>

</html>
