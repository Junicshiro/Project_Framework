    <!-- Form Login -->
    <div class="container py-5 align-items-center min-vh-100">
        <div class="row justify-content-center">
          <div class="col-md-6">
            <div class="card shadow-lg border-0 rounded-4">
              <div class="card-body p-4">
                <h3 class="card-title text-center mb-4 text-danger"><i class="bi bi-person-circle"></i> Login</h3>
                <div id="errorMsg" class="alert alert-danger d-none small text-center"></div>
                <form id="form-login">
                    <!-- Input Email/Username -->
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="text" class="form-control" id="email" placeholder="Masukkan email" required>
                    </div>
    
                    <!-- Input Password -->
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" placeholder="Masukkan password" required>
                    </div>
    
                    <!-- Lupa Password -->
                    <!-- <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <input type="checkbox" id="rememberMe">
                            <label for="rememberMe">Ingat saya</label>
                        </div>
                        <a href="#" class="text-decoration-none text-danger">Lupa password?</a>
                    </div> -->
    
                    <!-- Tombol Login -->
                    <div class="d-grid mt-3">
                        <button type="submit" class="btn btn-danger">Login</button>
                    </div>
    
                    <!-- Daftar Akun -->
                    <p class="text-center mt-3">
                        Belum punya akun? <a href="registrasi.html" class="text-danger">Daftar sekarang</a>

    <script src="assets\bootstrap\js\bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('produk').addEventListener('click', function(event) {
            window.location.href = 'produk.html';
        });

        document.addEventListener("DOMContentLoaded", function () {
        const loginForm = document.getElementById("form-login");

        if (loginForm) {
            loginForm.addEventListener("submit", async function (e) {
            e.preventDefault();

            const data = {
                email: document.getElementById("email").value,
                password: document.getElementById("password").value
            };

            const errorBox = document.getElementById("errorMsg");
            errorBox.classList.add("d-none");
            errorBox.innerText = "";

            try {
                const response = await fetch("https://elamore-backend-production.up.railway.app/api/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Accept": "application/json"
                },
                body: JSON.stringify(data)
                });

                const result = await response.json();
                if (response.ok) {
                localStorage.setItem("elamoreUser", JSON.stringify(result.user));
                window.location.href = "index.html";
                } else {
                errorBox.innerText = result.message || "Email atau password salah.";
                errorBox.classList.remove("d-none");
                }
            } catch (error) {
                errorBox.innerText = "Terjadi kesalahan koneksi. Coba lagi nanti.";
                errorBox.classList.remove("d-none");
            }
            });
        }
        });

        // Pencarian - Desktop
        document.getElementById("btnSearchDesktop").addEventListener("click", function () {
        const keyword = document.getElementById("searchDesktop").value.trim();
        if (keyword) {
            window.location.href = `produk.html?q=${encodeURIComponent(keyword)}`;
        }
        });

        document.getElementById("searchDesktop").addEventListener("keypress", function (e) {
        if (e.key === "Enter") {
            e.preventDefault();
            document.getElementById("btnSearchDesktop").click();
        }
        });

        // Pencarian - Mobile
        document.getElementById("btnSearchMobile").addEventListener("click", function () {
        const keyword = document.getElementById("searchMobile").value.trim();
        if (keyword) {
            const modal = bootstrap.Modal.getInstance(document.getElementById('searchModal'));
            modal.hide();
            setTimeout(() => {
            window.location.href = `produk.html?q=${encodeURIComponent(keyword)}`;
            }, 300);
        }
        });

        document.getElementById("searchMobile").addEventListener("keypress", function (e) {
        if (e.key === "Enter") {
            e.preventDefault();
            document.getElementById("btnSearchMobile").click();
        }
        });
    </script>
