    <!-- Form Login -->
    <div class="container py-5 min-vh-100">
        <div class="row justify-content-center">
          <div class="col-md-6">
            <div class="card shadow-lg border-0 rounded-4">
              <div class="card-body p-4">
                <h3 class="card-title text-center mb-4 text-danger"><i class="bi bi-person-plus-fill"></i> Registrasi</h3>
                
                <div id="errorMsg" class="alert alert-danger d-none small text-center"></div>
                <div id="successMsg" class="alert alert-success d-none small text-center"></div>
                <form id="form-registrasi">
                  <div class="mb-3">
                    <label for="name" class="form-label">Nama Lengkap</label>
                    <input type="text" class="form-control" id="name" placeholder="Masukkan nama Anda" required>
                  </div>
    
                  <div class="mb-3">
                    <label for="email" class="form-label">Alamat Email</label>
                    <input type="email" class="form-control" id="email" placeholder="contoh@email.com" required>
                  </div>

                  <div class="mb-3">
                    <label for="nomor" class="form-label">No HP</label>
                    <input type="text" class="form-control" id="nomor" placeholder="Masukkan nomor HP Anda" required>
                  </div>
    
                  <div class="mb-3">
                    <label for="alamat" class="form-label">Alamat</label>
                    <textarea class="form-control" id="alamat" rows="2" placeholder="Masukkan alamat lengkap" required></textarea>
                  </div>
    
                  <div class="mb-3">
                    <label for="password" class="form-label">Kata Sandi</label>
                    <input type="password" class="form-control" id="password" placeholder="********" required>
                  </div>
    
                  <div class="d-grid">
                    <button type="submit" class="btn btn-danger">
                      <i class="bi bi-person-check"></i> Daftar Sekarang
                    </button>
                  </div>
                </form>
    
                <div class="text-center mt-3">
                  <small>Sudah punya akun? <a href="login.html" class="text-decoration-none text-danger">Masuk di sini</a></small>
                </div>
              </div>
            </div>

    <script src="assets\bootstrap\js\bootstrap.bundle.min.js"></script>
    <script>
        // document.getElementById('produk').addEventListener('click', function(event) {
        //     // Jika klik dilakukan pada elemen dengan id 'produk', arahkan ke produk.html
        //     window.location.href = 'produk.html';
        // });

        const form = document.getElementById("form-registrasi");
        const errorBox = document.getElementById("errorMsg");
        const successBox = document.getElementById("successMsg");

        form.addEventListener("submit", async function (e) {
          e.preventDefault();

          errorBox.classList.add("d-none");
          successBox.classList.add("d-none");
          errorBox.innerText = "";
          successBox.innerText = "";

          const data = {
            name: document.getElementById("name").value,
            email: document.getElementById("email").value,
            nomor: document.getElementById("nomor").value,
            alamat: document.getElementById("alamat").value,
            password: document.getElementById("password").value,
          };

          try {
            const response = await fetch("https://elamore-backend-production.up.railway.app/api/register", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                Accept: "application/json",
              },
              body: JSON.stringify(data),
            });

            const result = await response.json();

            if (response.ok) {
              successBox.innerText = "Registrasi berhasil! Silakan login.";
              successBox.classList.remove("d-none");

              setTimeout(() => {
                window.location.href = "login.html";
              }, 1500);
            } else {
              if (result.errors) {
                const messages = Object.values(result.errors).flat().join(" ");
                errorBox.innerText = messages;
              } else {
                errorBox.innerText = result.message || "Registrasi gagal.";
              }
              errorBox.classList.remove("d-none");
            }
          } catch (err) {
            errorBox.innerText = "Terjadi kesalahan: " + err.message;
            errorBox.classList.remove("d-none");
          }
        });

    // Desktop
  document.getElementById("btnSearchDesktop").addEventListener("click", function () {
    const keyword = document.getElementById("searchDesktop").value.trim();
    if (keyword) {
      window.location.href = `produk.html?q=${encodeURIComponent(keyword)}`;
    }
  });

  document.getElementById("searchDesktop").addEventListener("keypress", function (e) {
    if (e.key === "Enter") {
      e.preventDefault();
      document.getElementById("btnSearchDesktop").click();
    }
  });

  // Mobile
  document.getElementById("btnSearchMobile").addEventListener("click", function () {
    const keyword = document.getElementById("searchMobile").value.trim();
    if (keyword) {
      // Tutup modal dulu
      const modal = bootstrap.Modal.getInstance(document.getElementById('searchModal'));
      modal.hide();
      setTimeout(() => {
        window.location.href = `produk.html?q=${encodeURIComponent(keyword)}`;
      }, 300);
    }
  });

  document.getElementById("searchMobile").addEventListener("keypress", function (e) {
    if (e.key === "Enter") {
      e.preventDefault();
      document.getElementById("btnSearchMobile").click();
    }
  });
    </script>
