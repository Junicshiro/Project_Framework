    <script>
        // document.getElementById('produk').addEventListener('click', function(event) {
        //     // Jika klik dilakukan pada elemen dengan id 'produk', arahkan ke produk.html
        //     window.location.href = 'produk.html';
        // });

        document.addEventListener("DOMContentLoaded", function () {
        document.querySelectorAll(".bi-person-circle").forEach(icon => {
            icon.addEventListener("click", function (e) {
                e.preventDefault();
                const userRaw = localStorage.getItem("elamoreUser");
                let userId = null;

                try {
                const elamoreUser = userRaw ? JSON.parse(userRaw) : null;
                userId = elamoreUser?.id || null;
                } catch (err) {
                console.warn("Gagal membaca localStorage:", err);
                }

                if (userId) {
                window.location.href = "akun_user.html";
                } else {
                window.location.href = "login.html";
                }
            });
            });
    });

    const elamoreUser = JSON.parse(localStorage.getItem("elamoreUser"));
    const userId = elamoreUser?.id || null;

    document.addEventListener("DOMContentLoaded", function () {
    if (!userId) {
        tampilkanKeranjang([]);
        return;
    }

    const cartBody = document.getElementById("cart-body");
    const totalHargaEl = document.getElementById("total-harga");

    function tampilkanKeranjang(data) {
        const cartBody = document.getElementById("cart-body");
        const totalHargaEl = document.getElementById("total-harga");
        const tabel = document.getElementById("keranjang-table");
        const kosong = document.getElementById("keranjang-kosong");
        const tombolBayar = document.getElementById("lanjut-pembayaran");

        if (!data || data.length === 0) {
            tabel.classList.add("d-none");
            kosong.classList.remove("d-none");
            tombolBayar.classList.add("d-none"); // 👉 sembunyikan tombol
            totalHargaEl.innerText = "Rp 0";
            return;
        } else {
            tabel.classList.remove("d-none");
            kosong.classList.add("d-none");
            tombolBayar.classList.remove("d-none"); // 👉 tampilkan kembali tombol
        }

        let totalHarga = 0;
        cartBody.innerHTML = "";

        data.forEach(item => {
        const subtotal = item.product.harga * item.quantity;
        totalHarga += subtotal;

        cartBody.innerHTML += `
            <tr data-id="${item.id}">
            <td>
                <div class="d-flex">
                <img src="${item.product.gambar}" class="img-fluid me-3" width="70" alt="${item.product.nama_produk}">
                <div>
                    <div class="fw-bold">${item.product.nama_produk}</div>
                    <div>Harga: Rp ${item.product.harga.toLocaleString("id-ID")}</div>
                    <div class="d-flex align-items-center my-2">
                    <button class="btn btn-sm btn-outline-secondary minus-btn">-</button>
                    <input type="number" min="1" value="${item.quantity}" class="form-control form-control-sm text-center mx-2 jumlah-input" style="width: 60px;">
                    <button class="btn btn-sm btn-outline-secondary plus-btn">+</button>
                    </div>
                    <button class="btn btn-sm btn-danger delete-btn"><i class="bi bi-trash"></i> Hapus</button>
                </div>
                </div>
            </td>
            <td class="text-center align-middle">Rp ${subtotal.toLocaleString("id-ID")}</td>
            </tr>
        `;
        });

        totalHargaEl.innerText = `Rp ${totalHarga.toLocaleString("id-ID")}`;
        aktifkanEventKeranjang();
    }

    function aktifkanEventKeranjang() {
        document.querySelectorAll(".plus-btn").forEach((btn, index) => {
        btn.addEventListener("click", () => ubahJumlah(index, 1));
        });
        document.querySelectorAll(".minus-btn").forEach((btn, index) => {
        btn.addEventListener("click", () => ubahJumlah(index, -1));
        });
        document.querySelectorAll(".delete-btn").forEach((btn, index) => {
        btn.addEventListener("click", () => hapusProduk(index));
        });
    }

    function ubahJumlah(index, delta) {
        const row = document.querySelectorAll("tbody tr")[index];
        const input = row.querySelector(".jumlah-input");
        let qty = parseInt(input.value) + delta;
        if (qty < 1) qty = 1;
        input.value = qty;

        fetch(`https://elamore-backend-production.up.railway.app/api/cart/${row.dataset.id}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json", Accept: "application/json" },
        body: JSON.stringify({ quantity: qty })
        }).then(() => {
        ambilKeranjang();
        });
    }

    function hapusProduk(index) {
        const row = document.querySelectorAll("tbody tr")[index];
        const cartId = row.dataset.id;

        fetch(`https://elamore-backend-production.up.railway.app/api/cart/${cartId}`, {
        method: "DELETE"
        }).then(() => {
        ambilKeranjang();
        });
    }

    function ambilKeranjang() {
        fetch(`https://elamore-backend-production.up.railway.app/api/cart/${userId}`)
        .then(res => res.json())
        .then(data => tampilkanKeranjang(data));
    }

    ambilKeranjang();
    });

    // Desktop
  document.getElementById("btnSearchDesktop").addEventListener("click", function () {
    const keyword = document.getElementById("searchDesktop").value.trim();
    if (keyword) {
      window.location.href = `produk.html?q=${encodeURIComponent(keyword)}`;
    }
  });

  document.getElementById("searchDesktop").addEventListener("keypress", function (e) {
    if (e.key === "Enter") {
      e.preventDefault();
      document.getElementById("btnSearchDesktop").click();
    }
  });

  // Mobile
  document.getElementById("btnSearchMobile").addEventListener("click", function () {
    const keyword = document.getElementById("searchMobile").value.trim();
    if (keyword) {
      // Tutup modal dulu
      const modal = bootstrap.Modal.getInstance(document.getElementById('searchModal'));
      modal.hide();
      setTimeout(() => {
        window.location.href = `produk.html?q=${encodeURIComponent(keyword)}`;
      }, 300);
    }
  });

  document.getElementById("searchMobile").addEventListener("keypress", function (e) {
    if (e.key === "Enter") {
      e.preventDefault();
      document.getElementById("btnSearchMobile").click();
    }
  });
    </script>
