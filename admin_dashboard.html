<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard Admin - Elamore</title>
    <link rel="stylesheet" href="assets/bootstrap/css/bootstrap.min.css" />
    <link rel="stylesheet" href="assets/bootstrap/bootstrap-icons-1.11.3/font/bootstrap-icons.min.css" />
    <style>
        .card {
            border: none;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>

<body style="background-color: #feedf3;">

    <nav class="navbar navbar-dark" style="background-color: #E91E63;">
        <div class="container-fluid">
            <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <span class="navbar-brand ms-2">Admin Elamore</span>
        </div>
    </nav>

    <div class="offcanvas offcanvas-start text-white" tabindex="-1" id="sidebarMenu" style="background-color: #ff71a3;">
        <div class="offcanvas-header" style="background-color: #E91E63;">
            <h5 class="offcanvas-title">Menu</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body">
            <ul class="nav flex-column">
                <li class="nav-item">
                    <a href="admin_dashboard.html" class="nav-link text-white active fw-bold">
                        <i class="bi bi-house-door me-2"></i> Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a href="manajemen_produk.html" class="nav-link text-white active link-danger opacity-75">
                        <i class="bi bi-box me-2"></i> Produk
                    </a>
                </li>
                <li class="nav-item">
                    <a href="manajemen_pesanan.html" class="nav-link text-white link-danger opacity-75">
                        <i class="bi bi-bag me-2"></i> Pesanan
                    </a>
                </li>
                <li class="nav-item">
                    <a href="manajemen_pengguna.html" class="nav-link text-white link-danger opacity-75">
                        <i class="bi bi-people me-2"></i> Pengguna
                    </a>
                </li>
                <li class="nav-item">
                    <button id="btnLogoutAdmin"
                        class="nav-link text-white link-danger opacity-75 border-0 bg-transparent">
                        <i class="bi bi-box-arrow-right me-2"></i> Logout
                    </button>
                </li>
            </ul>
        </div>
    </div>

    <div class="container-fluid px-4 py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2><i class="bi bi-house-door"></i> Dashboard</h2>
        </div>
        <div class="row">
            <div class="col-md-3 mb-3">
                <div class="card text-center">
                    <div class="card-body">
                        <h5 class="card-title"><i class="bi bi-flower1"></i> Total Produk</h5>
                        <p class="card-text" id="totalProduk"></p>
                    </div>
                </div>
            </div>
            <div class="col-md-3 mb-3">
                <div class="card text-center">
                    <div class="card-body">
                        <h5 class="card-title"><i class="bi bi-cart"></i> Total Pesanan</h5>
                        <p class="card-text" id="totalPesanan"></p>
                    </div>
                </div>
            </div>
            <div class="col-md-3 mb-3">
                <div class="card text-center">
                    <div class="card-body">
                        <h5 class="card-title"><i class="bi bi-people"></i> Total Pengguna</h5>
                        <p class="card-text" id="totalPengguna"></p>
                    </div>
                </div>
            </div>
            <div class="col-md-3 mb-3">
                <div class="card text-center">
                    <div class="card-body">
                        <h5 class="card-title"><i class="bi bi-cash-coin"></i> Pendapatan Bulan Ini</h5>
                        <p class="card-text" id="totalPendapatan"></p>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mt-5">
            <div class="col-md-8 mb-4">
                <div class="card">
                    <div class="card-header bg-danger text-white">Pendapatan 6 Bulan Terakhir</div>
                    <div class="card-body">
                        <canvas id="grafikPendapatan"></canvas>
                    </div>
                </div>
            </div>
            <div class="col-md-4 mb-4">
                <div class="card">
                    <div class="card-header bg-danger text-white">Status Pesanan</div>
                    <div class="card-body">
                        <canvas id="grafikPesanan"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="assets/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            fetch("https://elamore-backend-production.up.railway.app/api/admin/summary")
                .then(res => res.json())
                .then(data => {
                    document.getElementById("totalProduk").innerText = data.produk;
                    document.getElementById("totalPesanan").innerText = data.pesanan;
                    document.getElementById("totalPengguna").innerText = data.pengguna;
                    document.getElementById("totalPendapatan").innerText =
                        "Rp " + Number(data.pendapatan).toLocaleString("id-ID");
                });
        });

        document.getElementById("btnLogoutAdmin").addEventListener("click", function (e) {
            e.preventDefault();
            // Hapus data admin dari localStorage
            localStorage.removeItem("elamoreAdmin");
            // Redirect ke halaman login admin
            window.location.href = "admin_login.html";
        });

        const admin = localStorage.getItem("elamoreAdmin");
        if (!admin) {
            window.location.href = "admin_login.html"; // Redirect jika belum login
        }

        document.addEventListener("DOMContentLoaded", () => {
            fetch("https://elamore-backend-production.up.railway.app/api/admin/summary")
                .then(res => res.json())
                .then(data => {
                    document.getElementById("totalProduk").innerText = data.produk;
                    document.getElementById("totalPesanan").innerText = data.pesanan;
                    document.getElementById("totalPengguna").innerText = data.pengguna;
                    document.getElementById("totalPendapatan").innerText = "Rp " + Number(data.pendapatan).toLocaleString("id-ID");

                    // 🔴 Grafik Pendapatan Line
                    new Chart(document.getElementById("grafikPendapatan"), {
                        type: "line",
                        data: {
                            labels: data.bulan, // ['Jan', 'Feb', ...]
                            datasets: [{
                                label: "Rp",
                                data: data.pendapatan_bulanan, // [1000000, 2000000, ...]
                                fill: false,
                                borderColor: "#E91E63",
                                tension: 0.3
                            }]
                        },
                        options: {
                            responsive: true,
                            plugins: {
                                legend: { display: false }
                            }
                        }
                    });

                    // 🔴 Grafik Pesanan Donut
                    new Chart(document.getElementById("grafikPesanan"), {
                        type: "doughnut",
                        data: {
                            labels: ["Pending", "Confirmed", "Shipped", "Delivered", "Canceled"],
                            datasets: [{
                                data: [
                                    data.status.pesanan_pending,
                                    data.status.pesanan_confirmed,
                                    data.status.pesanan_shipped,
                                    data.status.pesanan_delivered,
                                    data.status.pesanan_canceled,
                                ],
                                backgroundColor: [
                                    "#6c757d", "#ffc107", "#0d6efd", "#198754", "#dc3545"
                                ]
                            }]
                        },
                        options: {
                            responsive: true,
                            plugins: {
                                legend: {
                                    position: "bottom"
                                }
                            }
                        }
                    });
                });
        });
    </script>

</body>

</html>
