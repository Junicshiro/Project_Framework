  <div class="container py-5">
    <h2 class="mb-4">Checkout</h2>

    <div id="keranjang-checkout" class="mb-4">
      <!-- Produk akan ditampilkan di sini -->
    </div>

    <form id="checkoutForm">
      <h5 class="mb-3">Informasi Pengiriman</h5>
      <div class="mb-3">
        <label for="nama" class="form-label">Nama</label>
        <input type="text" class="form-control" id="nama" required />
      </div>
      <div class="mb-3">
        <label for="alamat" class="form-label">Alamat</label>
        <textarea class="form-control" id="alamat" required></textarea>
      </div>
      <div class="mb-3">
        <label for="nomor" class="form-label">Nomor HP</label>
        <input type="tel" class="form-control" id="nomor" required />
      </div>

      <h5 class="mt-4 mb-3">Total: <span id="checkout-total" class="text-danger">Rp 0</span></h5>

      <button type="submit" class="btn btn-danger rounded-pill px-4">Konfirmasi Pembayaran</button>
    </form>
  </div>

  <script src="assets/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
        document.querySelectorAll(".bi-person-circle").forEach(icon => {
          icon.addEventListener("click", function (e) {
            e.preventDefault();
            const userRaw = localStorage.getItem("elamoreUser");
            let userId = null;

            try {
              const elamoreUser = userRaw ? JSON.parse(userRaw) : null;
              userId = elamoreUser?.id || null;
            } catch (err) {
              console.warn("Gagal membaca localStorage:", err);
            }

            if (userId) {
              window.location.href = "akun_user.html";
            } else {
              window.location.href = "login.html";
            }
          });
        });
    });

    const elamoreUser = JSON.parse(localStorage.getItem("elamoreUser"));
    const userId = elamoreUser?.id || null;

    let totalHarga = 0;
    let keranjang = [];

    document.addEventListener("DOMContentLoaded", () => {
      if (!userId) {
        document.getElementById("keranjang-checkout").innerHTML = "<p class='text-muted'>Silakan login terlebih dahulu.</p>";
        document.getElementById("checkoutForm").classList.add("d-none");
        return;
      }

      fetch(`https://elamore-backend-production.up.railway.app/api/cart/${userId}`)
        .then(res => res.json())
        .then(data => {
          keranjang = data;
          if (data.length === 0) {
            document.getElementById("keranjang-checkout").innerHTML = "<p class='text-muted'>Keranjang kosong.</p>";
            document.getElementById("checkoutForm").classList.add("d-none");
            return;
          }

          const isi = data.map(item => {
            const subtotal = item.quantity * item.product.harga;
            totalHarga += subtotal;
            return `
              <div class="mb-3">
                <strong>${item.product.nama_produk}</strong> (x${item.quantity}) - Rp ${subtotal.toLocaleString("id-ID")}
              </div>
            `;
          }).join("");

          document.getElementById("keranjang-checkout").innerHTML = isi;
          document.getElementById("checkout-total").innerText = `Rp ${totalHarga.toLocaleString("id-ID")}`;
        });

      document.getElementById("checkoutForm").addEventListener("submit", (e) => {
        e.preventDefault();
        const nama = document.getElementById("nama").value;
        const alamat = document.getElementById("alamat").value;
        const nomor = document.getElementById("nomor").value;

        fetch("https://elamore-backend-production.up.railway.app/api/checkout", {
          method: "POST",
          headers: { "Content-Type": "application/json", Accept: "application/json" },
          body: JSON.stringify({
            user_id: userId,
            nama,
            alamat,
            nomor_hp: nomor,
            items: keranjang,
            total_harga: totalHarga,
          }),
        })
        .then(res => res.json())
        .then(data => {
          alert("Pesanan berhasil dibuat!");
          window.location.href = "akun_user.html";
        });
      });
    });

    // Desktop
  document.getElementById("btnSearchDesktop").addEventListener("click", function () {
    const keyword = document.getElementById("searchDesktop").value.trim();
    if (keyword) {
      window.location.href = `produk.html?q=${encodeURIComponent(keyword)}`;
    }
  });

  document.getElementById("searchDesktop").addEventListener("keypress", function (e) {
    if (e.key === "Enter") {
      e.preventDefault();
      document.getElementById("btnSearchDesktop").click();
    }
  });

  // Mobile
  document.getElementById("btnSearchMobile").addEventListener("click", function () {
    const keyword = document.getElementById("searchMobile").value.trim();
    if (keyword) {
      // Tutup modal dulu
      const modal = bootstrap.Modal.getInstance(document.getElementById('searchModal'));
      modal.hide();
      setTimeout(() => {
        window.location.href = `produk.html?q=${encodeURIComponent(keyword)}`;
      }, 300);
    }
  });

  document.getElementById("searchMobile").addEventListener("keypress", function (e) {
    if (e.key === "Enter") {
      e.preventDefault();
      document.getElementById("btnSearchMobile").click();
    }
  });

  const TIMEOUT = 30 * 60 * 1000; // 30 menit dalam milidetik

  function perbaruiAktivitas() {
    localStorage.setItem("elamoreLastActive", Date.now());
  }

  function cekAutoLogout() {
    const user = localStorage.getItem("elamoreUser");
    const last = localStorage.getItem("elamoreLastActive");

    if (user && last && Date.now() - last > TIMEOUT) {
      localStorage.removeItem("elamoreUser");
      localStorage.removeItem("elamoreLastActive");
      window.location.href = "login.html";
    }
  }

  // Simpan waktu aktif saat halaman dimuat pertama kali
  perbaruiAktivitas();

  // Setiap aktivitas akan memperbarui waktu
  ["click", "mousemove", "keypress", "scroll", "touchstart"].forEach(event =>
    window.addEventListener(event, perbaruiAktivitas)
  );

  // Cek apakah waktunya logout setiap menit
  setInterval(cekAutoLogout, 60000);
  </script>
