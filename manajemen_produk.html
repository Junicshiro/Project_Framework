<!-- manajemen_produk.html -->
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Manajemen Produk</title>
  <link rel="stylesheet" href="assets/bootstrap/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="assets/bootstrap/bootstrap-icons-1.11.3/font/bootstrap-icons.min.css"/>
</head>
<body style="background-color: #feedf3;">

  <!-- Navbar -->
  <nav class="navbar navbar-dark" style="background-color: #E91E63;">
    <div class="container-fluid">
      <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <span class="navbar-brand ms-2">Admin Elamore</span>
    </div>
  </nav>

  <!-- Sidebar Offcanvas (untuk semua ukuran layar) -->
  <div class="offcanvas offcanvas-start text-white" tabindex="-1" id="sidebarMenu" style="background-color: #ff71a3;">
    <div class="offcanvas-header" style="background-color: #E91E63;">
      <h5 class="offcanvas-title">Menu</h5>
      <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body">
      <ul class="nav flex-column">
        <li class="nav-item">
            <a href="admin_dashboard.html" class="nav-link text-white active link-danger opacity-75">
                <i class="bi bi-house-door me-2"></i> Dashboard
            </a>
        </li>
        <li class="nav-item">
          <a href="manajemen_produk.html" class="nav-link text-white active fw-bold">
            <i class="bi bi-box me-2"></i> Produk
          </a>
        </li>
        <li class="nav-item">
          <a href="manajemen_pesanan.html" class="nav-link text-white link-danger opacity-75">
            <i class="bi bi-bag me-2"></i> Pesanan
          </a>
        </li>
        <li class="nav-item">
          <a href="manajemen_pengguna.html" class="nav-link text-white link-danger opacity-75">
            <i class="bi bi-people me-2"></i> Pengguna
          </a>
        </li>
        <li class="nav-item">
            <button id="btnLogoutAdmin" class="nav-link text-white link-danger opacity-75 border-0 bg-transparent">
              <i class="bi bi-box-arrow-right me-2"></i> Logout
            </button>
        </li>
      </ul>
    </div>
  </div>

  <!-- Konten Utama -->
  <div class="min-vh-100">
    <div class="container-fluid px-4 py-4">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-box"></i> Manajemen Produk</h2>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalTambahProduk">
          <i class="bi bi-plus-circle"></i> Tambah Produk
        </button>
      </div>

      <div class="input-group mb-3">
        <input type="text" class="form-control" id="searchProduk" placeholder="Cari nama atau kategori produk...">
        <button class="btn btn-outline-secondary" type="button" onclick="cariProduk()">Cari</button>
      </div>

      <div class="table-responsive d-none d-sm-block">
        <table class="table table-hover table-bordered text-center align-middle">
          <thead class="table-danger">
            <tr>
              <th>ID</th>
              <th>Gambar</th>
              <th>Nama Produk</th>
              <th>Harga</th>
              <th>Stok</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="produk-list">
            <tr><td colspan="6">Memuat data produk...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Tampilan mobile -->
    <div class="d-block d-sm-none px-3" id="produk-cards">
      <!-- Kartu produk akan diisi dari JS -->
    </div>
  </div>

  <!-- Modal Tambah Produk -->
  <div class="modal fade" id="modalTambahProduk" tabindex="-1" aria-labelledby="modalTambahLabel" aria-hidden="true">
    <div class="modal-dialog">
      <form id="formTambahProduk" class="modal-content">
        <div class="modal-header bg-danger text-white">
          <h5 class="modal-title" id="modalTambahLabel">Tambah Produk</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label for="nama" class="form-label">Nama Produk</label>
            <input type="text" class="form-control" id="nama" required>
          </div>
          <div class="mb-3">
            <label for="harga" class="form-label">Harga</label>
            <input type="number" class="form-control" id="harga" required>
          </div>
          <div class="mb-3">
            <label for="gambar" class="form-label">URL Gambar</label>
            <input type="text" class="form-control" id="gambar" required>
          </div>
          <div class="mb-3">
            <label for="stok" class="form-label">Stok</label>
            <input type="number" class="form-control" id="stok" required>
          </div>
          <div class="mb-3">
            <label for="kategori" class="form-label">Kategori</label>
            <select class="form-select" id="kategori" required>
              <option value="">Pilih Kategori</option>
              <option value="buket bunga">Buket Bunga</option>
              <option value="buket uang">Buket Uang</option>
              <option value="buket snack">Buket Snack</option>
            </select>
          </div>
          <div class="mb-3">
            <label for="deskripsi" class="form-label">Deskripsi</label>
            <textarea class="form-control" id="deskripsi" rows="3"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-danger">Simpan</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal Edit Produk -->
  <div class="modal fade" id="modalEditProduk" tabindex="-1" aria-labelledby="modalEditLabel" aria-hidden="true">
    <div class="modal-dialog">
      <form id="formEditProduk" class="modal-content">
        <div class="modal-header bg-warning">
          <h5 class="modal-title" id="modalEditLabel">Edit Produk</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="editId">
          <div class="mb-3">
            <label class="form-label">Nama Produk</label>
            <input type="text" class="form-control" id="editNama" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Harga</label>
            <input type="number" class="form-control" id="editHarga" required>
          </div>
          <div class="mb-3">
            <label class="form-label">URL Gambar</label>
            <input type="text" class="form-control" id="editGambar" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Stok</label>
            <input type="number" class="form-control" id="editStok" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Kategori</label>
            <select class="form-select" id="editKategori" required>
              <option value="buket bunga">Buket Bunga</option>
              <option value="buket uang">Buket Uang</option>
              <option value="buket snack">Buket Snack</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Deskripsi</label>
            <textarea class="form-control" id="editDeskripsi" rows="3"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-warning">Simpan Perubahan</button>
        </div>
      </form>
    </div>
  </div>

  
  <footer class="bg-dark text-white text-center py-3">
    <p>&copy; 2025 Elamore. All rights reserved.</p>
  </footer>

  <script src="assets/bootstrap/js/bootstrap.bundle.min.js"></script>

  <script>
  let semuaProduk = [];

  document.addEventListener("DOMContentLoaded", function () {
    const tbody = document.getElementById("produk-list");
    const cards = document.getElementById("produk-cards");
    const inputSearch = document.getElementById("searchProduk");

    // Ambil produk dari API
    fetch("http://localhost:8000/api/products")
      .then(res => res.json())
      .then(data => {
        semuaProduk = data;
        tampilkanProduk(data);
      });

    // Fungsi tampilkan produk (desktop + mobile)
    function tampilkanProduk(data) {
      tbody.innerHTML = "";
      cards.innerHTML = "";

      if (data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6">Produk tidak ditemukan.</td></tr>`;
        cards.innerHTML = `<p class="text-center text-muted">Produk tidak ditemukan.</p>`;
        return;
      }

      data.forEach(p => {
        // TABEL DESKTOP
        tbody.innerHTML += `
          <tr>
            <td>${p.id}</td>
            <td><img src="${p.gambar}" style="width: 60px; height: auto; border-radius: 8px;"></td>
            <td>${p.nama_produk}</td>
            <td>Rp ${p.harga.toLocaleString('id-ID')}</td>
            <td>${p.stok}</td>
            <td>
              <button class="btn btn-warning btn-sm me-2" onclick="editProduk(${p.id})"><i class="bi bi-pencil"></i></button>
              <button class="btn btn-danger btn-sm" onclick="hapusProduk(${p.id})"><i class="bi bi-trash"></i></button>
            </td>
          </tr>
        `;

        // KARTU MOBILE
        cards.innerHTML += `
          <div class="card mb-3 shadow-sm border-0" style="border-radius: 12px;">
            <div class="card-body">
              <div class="row g-2 align-items-center">
                <div class="col-4">
                  <img src="${p.gambar}" class="img-fluid rounded" alt="${p.nama_produk}" style="max-height: 100px; object-fit: cover;">
                </div>
                <div class="col-8">
                  <h6 class="fw-bold mb-1 text-truncate">${p.nama_produk}</h6>
                  <div class="text-muted small mb-1">Kategori: <span class="text-dark">${p.kategori}</span></div>
                  <div class="text-muted small mb-1">Harga: <span class="text-dark">Rp ${p.harga.toLocaleString('id-ID')}</span></div>
                  <div class="text-muted small mb-2">Stok: <span class="text-dark">${p.stok}</span></div>
                </div>
              </div>
              <div class="d-flex gap-2 mt-2">
                <button class="btn btn-sm btn-outline-warning flex-fill" onclick="editProduk(${p.id})"><i class="bi bi-pencil"></i> Edit</button>
                <button class="btn btn-sm btn-outline-danger flex-fill" onclick="hapusProduk(${p.id})"><i class="bi bi-trash"></i> Hapus</button>
              </div>
            </div>
          </div>
        `;
      });
    }

    // Fungsi pencarian
    window.cariProduk = function () {
      const keyword = inputSearch.value.toLowerCase();
      const hasil = semuaProduk.filter(p =>
        p.nama_produk.toLowerCase().includes(keyword) ||
        p.kategori.toLowerCase().includes(keyword) ||
        (p.deskripsi || "").toLowerCase().includes(keyword)
      );
      tampilkanProduk(hasil);
    };

    // Fungsi hapus produk
    window.hapusProduk = function (id) {
      if (!confirm("Yakin ingin menghapus produk ini?")) return;

      fetch(`http://localhost:8000/api/products/${id}`, {
        method: "DELETE"
      }).then(res => res.json())
        .then(() => {
          alert("Produk dihapus.");
          semuaProduk = semuaProduk.filter(p => p.id !== id);
          tampilkanProduk(semuaProduk);
        });
    };

    // Fungsi edit produk (isi modal)
    window.editProduk = function (id) {
      const p = semuaProduk.find(prod => prod.id === id);
      if (!p) return;

      document.getElementById("editId").value = p.id;
      document.getElementById("editNama").value = p.nama_produk;
      document.getElementById("editHarga").value = p.harga;
      document.getElementById("editGambar").value = p.gambar;
      document.getElementById("editStok").value = p.stok;
      document.getElementById("editKategori").value = p.kategori;
      document.getElementById("editDeskripsi").value = p.deskripsi;

      new bootstrap.Modal(document.getElementById("modalEditProduk")).show();
    };

    // Submit form edit produk
    document.getElementById("formEditProduk").addEventListener("submit", async function (e) {
      e.preventDefault();

      const id = document.getElementById("editId").value;
      const data = {
        nama_produk: document.getElementById("editNama").value,
        harga: parseInt(document.getElementById("editHarga").value),
        gambar: document.getElementById("editGambar").value,
        stok: parseInt(document.getElementById("editStok").value),
        kategori: document.getElementById("editKategori").value,
        deskripsi: document.getElementById("editDeskripsi").value,
      };

      const response = await fetch(`http://localhost:8000/api/products/${id}`, {
        method: "PUT",
        headers: {
          "Content-Type": "application/json",
          "Accept": "application/json"
        },
        body: JSON.stringify(data)
      });

      const result = await response.json();

      if (response.ok) {
        alert("Produk berhasil diperbarui!");
        const modal = bootstrap.Modal.getInstance(document.getElementById("modalEditProduk"));
        modal.hide();
        semuaProduk = semuaProduk.map(p => p.id == id ? result.produk : p);
        tampilkanProduk(semuaProduk);
      } else {
        alert("Gagal memperbarui produk");
      }
    });

    // Submit form tambah produk
    document.getElementById("formTambahProduk").addEventListener("submit", async function (e) {
      e.preventDefault();

      const data = {
        nama_produk: document.getElementById("nama").value,
        harga: parseInt(document.getElementById("harga").value),
        gambar: document.getElementById("gambar").value,
        stok: parseInt(document.getElementById("stok").value),
        kategori: document.getElementById("kategori").value,
        deskripsi: document.getElementById("deskripsi").value,
      };

      try {
        const response = await fetch("http://localhost:8000/api/products", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Accept": "application/json"
          },
          body: JSON.stringify(data)
        });

        const result = await response.json();

        if (response.ok) {
          alert("Produk berhasil ditambahkan!");
          const modal = bootstrap.Modal.getInstance(document.getElementById("modalTambahProduk"));
          modal.hide();
          document.getElementById("formTambahProduk").reset();

          // Tambahkan produk baru ke semuaProduk dan render ulang
          semuaProduk.push(result.produk || result); // antisipasi respons beragam
          tampilkanProduk(semuaProduk);
        } else {
          alert("Gagal menambahkan produk: " + JSON.stringify(result));
        }
      } catch (error) {
        alert("Terjadi kesalahan saat menambah produk: " + error.message);
      }
    });
  });

  document.getElementById("btnLogoutAdmin").addEventListener("click", function (e) {
        e.preventDefault();
        // Hapus data admin dari localStorage
        localStorage.removeItem("elamoreAdmin");
        // Redirect ke halaman login admin
        window.location.href = "admin_login.html";
    });

  const admin = localStorage.getItem("elamoreAdmin");
  if (!admin) {
    window.location.href = "admin_login.html"; // Redirect jika belum login
  }
  </script>

    
</body>
</html>
