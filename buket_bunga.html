            <div class="col-md-4 ms-auto">
              <select id="sortHarga" class="form-select">
                <option value="default">Urutkan berdasarkan</option>

    <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 9999">
      <div id="elamoreToast" class="toast align-items-center text-white bg-success border-0 d-none" role="alert">
        <div class="d-flex">
          <div class="toast-body" id="elamoreToastMsg">Berhasil!</div>

    <script>
        // document.getElementById('produk').addEventListener('click', function(event) {
        //     // Jika klik dilakukan pada elemen dengan id 'produk', arahkan ke produk.html
        //     window.location.href = 'produk.html';
        // });

        let produkBunga = [];

        function tampilkanProduk(data) {
          const list = document.getElementById("buket-bunga-list");
          list.innerHTML = data.map(buatCardProduk).join("");

          setTimeout(() => {
            document.querySelectorAll('[title="Tambah ke Favorit"]').forEach((btn, index) => {
              btn.addEventListener("click", () => {
                if (!userId) return showToast("Silakan login terlebih dahulu", true);
                const productId = document.querySelectorAll(".card")[index].getAttribute("data-id");

                fetch("https://elamore-backend-production.up.railway.app/api/favorites", {
                  method: "POST",
                  headers: { "Content-Type": "application/json", "Accept": "application/json" },
                  body: JSON.stringify({ user_id: userId, product_id: productId }),
                }).then(res => res.json()).then(() => {
                  const icon = btn.querySelector("i");
                  icon.classList.remove("bi-heart");
                  icon.classList.add("bi-heart-fill", "text-danger");
                });
              });
            });

            document.querySelectorAll(".btn-outline-danger").forEach((btn, index) => {
              btn.addEventListener("click", () => {
                if (!userId) return showToast("Silakan login terlebih dahulu", true);
                const productId = document.querySelectorAll(".card")[index].getAttribute("data-id");

                fetch("https://elamore-backend-production.up.railway.app/api/cart", {
                  method: "POST",
                  headers: { "Content-Type": "application/json", "Accept": "application/json" },
                  body: JSON.stringify({ user_id: userId, product_id: productId, quantity: 1 }),
                }).then(res => res.json()).then(() => {
                  showToast("Produk berhasil ditambahkan ke keranjang.");
                });
              });
            });
          }, 300);
        }

        document.addEventListener("DOMContentLoaded", function () {
        // const ikonUser = document.querySelector(".bi-person-circle");
        const list = document.getElementById("buket-bunga-list");

        document.querySelectorAll(".bi-person-circle").forEach(icon => {
          icon.addEventListener("click", function (e) {
            e.preventDefault();
            const userRaw = localStorage.getItem("elamoreUser");
            let userId = null;

            try {
              const elamoreUser = userRaw ? JSON.parse(userRaw) : null;
              userId = elamoreUser?.id || null;
            } catch (err) {
              console.warn("Gagal membaca localStorage:", err);
            }

            if (userId) {
              window.location.href = "akun_user.html";
            } else {
              window.location.href = "login.html";
            }
          });
        });

        // Ambil semua produk dari API dan filter hanya buket bunga
        fetch("https://elamore-backend-production.up.railway.app/api/products")
          .then(res => res.json())
          .then(data => {
            produkBunga = data.filter(p => p.kategori.toLowerCase() === "buket bunga");
            tampilkanProduk(produkBunga);

            // Tambah event listener favorit dan keranjang
            // setTimeout(() => {
            //   document.querySelectorAll('[title="Tambah ke Favorit"]').forEach((btn, index) => {
            //     btn.addEventListener("click", () => {
            //       if (!userId) return showToast("Silakan login terlebih dahulu", true);
            //       const productId = document.querySelectorAll(".card")[index].getAttribute("data-id");

            //       fetch("https://elamore-backend-production.up.railway.app/api/favorites", {
            //         method: "POST",
            //         headers: { "Content-Type": "application/json", "Accept": "application/json" },
            //         body: JSON.stringify({ user_id: userId, product_id: productId }),
            //       })
            //         .then(res => res.json())
            //         .then(() => {
            //           const icon = btn.querySelector("i");
            //           icon.classList.remove("bi-heart");
            //           icon.classList.add("bi-heart-fill", "text-danger");
            //         });
            //     });
            //   });

            //   document.querySelectorAll(".btn-outline-danger").forEach((btn, index) => {
            //     btn.addEventListener("click", () => {
            //       if (!userId) return showToast("Silakan login terlebih dahulu", true);
            //       const productId = document.querySelectorAll(".card")[index].getAttribute("data-id");

            //       fetch("https://elamore-backend-production.up.railway.app/api/cart", {
            //         method: "POST",
            //         headers: { "Content-Type": "application/json", "Accept": "application/json" },
            //         body: JSON.stringify({ user_id: userId, product_id: productId, quantity: 1 }),
            //       })
            //         .then(res => res.json())
            //         .then(() => showToast("Produk berhasil ditambahkan ke keranjang."));
            //     });
            //   });
            // }, 300);

            document.getElementById("sortHarga").addEventListener("change", function () {
              const value = this.value;

              let data = [...produkBunga]; // array salinan agar tidak ubah data asli

              if (value === "asc") {
                data.sort((a, b) => a.harga - b.harga);
              } else if (value === "desc") {
                data.sort((a, b) => b.harga - a.harga);
              }

              tampilkanProduk(data);
            });
          });
      });

      const elamoreUser = JSON.parse(localStorage.getItem("elamoreUser"));
      const userId = elamoreUser?.id || null;

      function buatCardProduk(p) {
        return `
          <div class="col-md-4">
            <div class="card shadow-sm border-0 h-100 hover-shadow transition" data-id="${p.id}">
              <button type="button" class="btn btn-light btn-sm rounded-circle position-absolute top-0 end-0 m-2 shadow-sm" title="Tambah ke Favorit">
                <i class="bi bi-heart"></i>
              </button>
              <img src="${p.gambar}" class="card-img-top" alt="${p.nama_produk}">
              <div class="card-body text-center">
                <h5 class="card-title text-danger fw-semibold">${p.nama_produk}</h5>
                <p class="card-text text-muted fs-5 mb-3">Rp ${p.harga.toLocaleString('id-ID')}</p>
                <button type="button" class="btn btn-outline-danger rounded-pill px-4">Tambah ke Keranjang</button>
              </div>
            </div>
          </div>
        `;
      }

      // Desktop
      document.getElementById("btnSearchDesktop").addEventListener("click", function () {
        const keyword = document.getElementById("searchDesktop").value.trim();
        if (keyword) {
          window.location.href = `produk.html?q=${encodeURIComponent(keyword)}`;
        }
      });

      document.getElementById("searchDesktop").addEventListener("keypress", function (e) {
        if (e.key === "Enter") {
          e.preventDefault();
          document.getElementById("btnSearchDesktop").click();
        }
      });

      // Mobile
      document.getElementById("btnSearchMobile").addEventListener("click", function () {
        const keyword = document.getElementById("searchMobile").value.trim();
        if (keyword) {
          // Tutup modal dulu
          const modal = bootstrap.Modal.getInstance(document.getElementById('searchModal'));
          modal.hide();
          setTimeout(() => {
            window.location.href = `produk.html?q=${encodeURIComponent(keyword)}`;
          }, 300);
        }
      });

      document.getElementById("searchMobile").addEventListener("keypress", function (e) {
        if (e.key === "Enter") {
          e.preventDefault();
          document.getElementById("btnSearchMobile").click();
        }
      });

      function showToast(message, isError = false) {
      const toast = document.getElementById("elamoreToast");
      const toastMsg = document.getElementById("elamoreToastMsg");

      toast.classList.remove("bg-success", "bg-danger", "d-none");
      toast.classList.add(isError ? "bg-danger" : "bg-success");

      toastMsg.textContent = message;

      const bsToast = new bootstrap.Toast(toast);
      bsToast.show();
    }

    function hideToast() {
      const toast = document.getElementById("elamoreToast");
      toast.classList.add("d-none");
    }

    const TIMEOUT = 30 * 60 * 1000; // 30 menit dalam milidetik

  function perbaruiAktivitas() {
    localStorage.setItem("elamoreLastActive", Date.now());
  }

  function cekAutoLogout() {
    const user = localStorage.getItem("elamoreUser");
    const last = localStorage.getItem("elamoreLastActive");

    if (user && last && Date.now() - last > TIMEOUT) {
      localStorage.removeItem("elamoreUser");
      localStorage.removeItem("elamoreLastActive");
      window.location.href = "login.html";
    }
  }

  // Simpan waktu aktif saat halaman dimuat pertama kali
  perbaruiAktivitas();

  // Setiap aktivitas akan memperbarui waktu
  ["click", "mousemove", "keypress", "scroll", "touchstart"].forEach(event =>
    window.addEventListener(event, perbaruiAktivitas)
  );

  // Cek apakah waktunya logout setiap menit
  setInterval(cekAutoLogout, 60000);
    </script>
